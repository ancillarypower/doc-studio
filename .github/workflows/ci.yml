name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # no lockfile is committed yet (phase A); phase B pins one and switches to --frozen-lockfile
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit + engine tests (generates fixtures/)
        run: pnpm test
      - name: Build the port
        run: pnpm build
      - name: Build the visual baseline (original artifact source)
        run: pnpm build:reference
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke, axe and per-section visual diff
        run: pnpm e2e
      - name: Visual + axe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-report
          path: |
            visual-report/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Summary
        if: always()
        run: |
          {
            echo "## Visual gate (pixel ≤ 2% · layout ±4px)"
            echo '```'
            cat visual-report/summary.txt 2>/dev/null || echo "no visual summary (e2e did not reach the visual spec)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
