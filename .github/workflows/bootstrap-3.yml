# Temporary workflow for issue #3. Do not merge.
# Generates pnpm-lock.yaml on main@051077f and pushes it to bootstrap/3-result.
name: bootstrap-3

on:
  push:
    branches: [ci/bootstrap-3-CU-z94x8e70uc]

permissions: {}

concurrency:
  group: bootstrap-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CI: "true"
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 051077f3078e7657a9ee6abd8fd008ed34b5785e
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # same command as ci.yml L32
      - run: pnpm install --no-frozen-lockfile
      - name: Diff stat
        run: |
          git add -N pnpm-lock.yaml
          git diff --stat
          git status --porcelain
      - name: Commit lockfile to bootstrap/3-result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate lockfile via CI bootstrap (#3)"
          git format-patch -1 --stdout > bootstrap-3.patch
          git push origin HEAD:refs/heads/bootstrap/3-result
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-3.patch
          path: bootstrap-3.patch
          retention-days: 7
